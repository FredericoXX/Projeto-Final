# Configuração genérica para uma única base de dados.

[alembic]
# Caminho dos scripts de migração.
# Normalmente é um caminho no formato POSIX (por exemplo, barras normais),
# relativo ao token %(here)s, que representa a localização deste arquivo ini.
script_location = %(here)s/alembic

# Modelo usado para gerar nomes de migrações; o padrão é %%(rev)s_%%(slug)s.
# Descomente a linha abaixo para prefixar os arquivos com data e hora.
# Consulte https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# para ver todos os tokens disponíveis.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# Ou organize em subdiretorias por data (exige recursive_version_locations = true).
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Caminho a acrescentar ao início de sys.path, se presente.
# O padrão é a diretoria de trabalho atual. Para vários caminhos, o separador é
# definido por "path_separator" abaixo.
prepend_sys_path = .


# Fuso horário usado ao renderizar a data na migração e no nome do arquivo.
# Se definido, exige a biblioteca tzdata, instalável ao acrescentar `alembic[tz]`
# aos requisitos do pip. O valor textual é passado a ZoneInfo().
# Deixe vazio para usar a hora local.
# timezone =

# Número máximo de caracteres aplicado ao campo "slug".
# truncate_slug_length = 40

# Defina como 'true' para executar o ambiente durante o comando 'revision',
# independentemente de autogenerate.
# revision_environment = false

# Defina como 'true' para permitir que arquivos .pyc e .pyo sem arquivo-fonte
# .py sejam detetados como revisões na diretoria versions/.
# sourceless = false

# Localização das versões; o padrão é <script_location>/versions. Ao usar várias
# diretorias, revisões iniciais devem ser indicadas com --version-path. O separador
# usado aqui deve ser o definido por "path_separator" abaixo.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator indica o caráter usado para dividir listas de caminhos, incluindo
# version_locations e prepend_sys_path em arquivos configparser como alembic.ini.
# O padrão em novos arquivos alembic.ini é "os", que usa os.pathsep para separar
# caminhos conforme o sistema operativo.
#
# Para suportar arquivos alembic.ini antigos, esse padrão NÃO é aplicado quando
# path_separator está ausente. Se a opção for totalmente omitida, aplica-se:
#
# 1. A leitura de version_locations tenta a chave antiga "version_path_separator"
#    e, se ausente, separa por espaços e/ou vírgulas.
# 2. A leitura de prepend_sys_path usa o comportamento antigo de separação por
#    espaços, vírgulas ou dois-pontos.
#
# Valores válidos para path_separator:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# Usar os.pathsep. Configuração padrão de novos projetos.
path_separator = os

# Defina como 'true' para pesquisar arquivos-fonte recursivamente em cada
# diretoria de "version_locations". Disponível desde o Alembic 1.10.
# recursive_version_locations = false

# Codificação de saída usada ao escrever revisões a partir de script.py.mako.
# output_encoding = utf-8

# URL da base de dados. Consumido apenas pelo script env.py mantido pelo projeto.
# Outras formas de configurar URLs podem ser personalizadas em env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks define scripts ou funções Python executados em novas revisões.
# Consulte a documentação para obter detalhes e exemplos.

# Formatar com "black": usar console_scripts com o entrypoint "black".
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Executar lint e tentar corrigir com "ruff": usar o módulo "ruff".
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Em alternativa, usar exec para executar um binário encontrado no PATH.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Configuração de logs, também consumida apenas pelo env.py mantido pelo projeto.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
