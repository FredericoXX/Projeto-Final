name: Frontend checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Uses the committed lockfile; no network beyond the registry install.
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      # Tests run entirely against MSW — no backend and no API key required.
      - name: Test
        run: npm run test:run
      - name: Build
        run: npm run build
