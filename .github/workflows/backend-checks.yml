name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: institutional_assistant
          POSTGRES_USER: assistant_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant_user -d institutional_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://assistant_user:test_password@localhost:5432/institutional_assistant
      TEST_DATABASE_URL: postgresql+psycopg://assistant_user:test_password@localhost:5432/institutional_assistant_test
      JWT_SECRET_KEY: ci_only_secret_key_with_at_least_32_characters
      BOOTSTRAP_TOKEN: ci_only_bootstrap_token
      DOCUMENT_STORAGE_PATH: /tmp/institutional-assistant-documents
      DOCUMENT_MAX_FILE_SIZE_MB: "20"

    steps:
      - uses: actions/checkout@v5
      # Valida apenas a sintaxe/interpolação do docker-compose.yml; a base
      # de dados de CI continua a ser o service container acima — o Compose
      # nunca é iniciado no workflow.
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: institutional_assistant
          POSTGRES_USER: assistant_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_PORT: "5433"
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify application imports
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Type check
        working-directory: backend
        run: mypy app tests
      - name: Verify migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Test
        working-directory: backend
        run: pytest -q
